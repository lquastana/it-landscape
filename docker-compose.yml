name: it-landscape
# Développement / démonstration. Sans NETBOX_URL et NETBOX_TOKEN : jeu de démonstration.
services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - auth:/app/data/auth
    environment:
      NODE_ENV: production
      IT_LANDSCAPE_ENV: ${IT_LANDSCAPE_ENV:-development}
      NETBOX_URL: ${NETBOX_URL:-}
      NETBOX_TOKEN: ${NETBOX_TOKEN:-}
      NETBOX_PUBLIC_URL: ${NETBOX_PUBLIC_URL:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-only-nextauth-secret-change-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}

volumes:
  auth:
