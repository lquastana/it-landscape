name: it-landscape
# Développement / démonstration. Sans NETBOX_URL et NETBOX_TOKEN : jeu de démonstration.
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NETBOX_URL: ${NETBOX_URL:-}
      NETBOX_TOKEN: ${NETBOX_TOKEN:-}
      NETBOX_PUBLIC_URL: ${NETBOX_PUBLIC_URL:-}
